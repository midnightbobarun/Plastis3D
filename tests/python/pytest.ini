# Makes tests/python pytest's rootdir (R-18). Without it, a checkout whose
# directory name is not a Python identifier (e.g. a hyphenated worktree)
# fails collection: pytest imports the repo root's __init__.py as a package,
# cannot name it, and its relative import breaks. Run `pytest tests/python`
# (or `npm run test:python`); bare `pytest` from the repo root is not
# supported.
[pytest]
